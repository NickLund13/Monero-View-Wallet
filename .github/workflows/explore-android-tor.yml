# Temporary: looks up the Tor Project's Android builds of tor (their file
# names, signatures, checksums and what is in them) on a GitHub runner, which
# can reach the Tor Project's archive. Removed again before the pull request
# is ready.
name: Explore Android Tor (temporary)

on:
  push:
    branches: [claude/android-camera-tor-dsd9qz]
    paths: [.github/workflows/explore-android-tor.yml]

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look closer at the Android tor
        run: |
          set -eu
          V=15.0.24
          BASE=https://archive.torproject.org/tor-package-archive/torbrowser/$V
          f=tor-expert-bundle-android-x86_64-$V.tar.gz
          curl -fsSLO "$BASE/$f"
          echo "500d51006f1938dfd5ecd0653b0d2a156feff8a4dc5e2b61b81793d47854fc90  $f" | sha256sum -c -
          tar -xzf "$f" tor/libTor.so data/torrc-defaults docs/zstd-bsd.txt
          echo "--- torrc-defaults"; cat data/torrc-defaults
          echo "--- strings"
          strings -n 6 tor/libTor.so | grep -iE 'general public|gpl|equix|hashx|^1\.[0-9]+\.[0-9]+$|^5\.[0-9]+\.[0-9]+|zstd|lzma|2\.1\.[0-9]+-stable|^1\.[23]\.[0-9]+' | sort -u | head -60
          echo "--- zstd-bsd.txt"; cat docs/zstd-bsd.txt
          for t in v1.5.5 v1.5.6 v1.5.7; do
            curl -fsSL "https://raw.githubusercontent.com/facebook/zstd/$t/LICENSE" | sha256sum | sed "s/-/zstd $t LICENSE/"
          done
          sha256sum docs/zstd-bsd.txt
